# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: OTWD API
  version: 1.0.0
  summary: Read Open Touring sites and send contributors' submissions back for moderation.
  description: |
    The OTWD API serves the Open Touring and Waypoint Database: the sites travellers stop at on
    the road, such as campsites, caravan parks, free camps, rest areas, dump points, water and
    toilets. Partner apps read sites, governed lists, bulk downloads and the change feed, and send
    their contributors' submissions, which are moderated before they become changes.

    Every request needs an API key, including bulk downloads. Keys are free. Paid tiers add
    volume, the change feed and its changeApplied webhook, delta files, a service level and
    support. Contributing is free on every tier, and that includes the submissionDecided webhook,
    which reports the outcome of a partner app's own submissions.

    ## Attribution

    OTWD data is licensed under the Creative Commons Attribution 4.0 International licence
    (CC BY 4.0). Anything that shows OTWD data must credit it where the data is shown, for example
    in a map footer, an about screen or next to the site details:

    > Data: Open Touring contributors, opentouring.org, CC BY 4.0

    Some facts come from seed sources whose licences need their own credit. Every site in the
    compact form lists the credits it needs in `attribution`, and every fact in the full form
    carries its seed source's `attribution` in its provenance. Show those credits too. Photos carry
    their own `attribution`, which must be shown with the photo.

    ## Licences

    The data is CC BY 4.0. This specification and the OTWD JSON Schema it uses are Apache-2.0.
  termsOfService: https://opentouring.org/terms
  contact:
    name: Open Touring
    url: https://opentouring.org
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-data-licence:
    name: CC BY 4.0
    identifier: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Data: Open Touring contributors, opentouring.org, CC BY 4.0"

servers:
  - url: https://api.opentouring.org
    description: Production

security:
  - ApiKey: []

tags:
  - name: Sites
    description: Read sites, by area or by public ID.
  - name: Governed lists
    description: The site types and facilities sites are described with.
  - name: Bulk downloads
    description: The whole dataset, or the changes between two sequence numbers, as files.
  - name: Change feed
    description: Every change applied to the live data, in order. Paid tiers.
  - name: Submissions
    description: Send a contributor's new site, corrections, photos, closures, merge requests and problem reports for moderation.

paths:
  /v1/sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List sites
      description: |
        Returns sites in an area, with optional filters. Give either `bbox` or `near`, not both.
        Without either, the whole dataset is paged through in public ID order, which suits a first
        sync, although a bulk download is faster for that.

        Filters combine with AND. A list-valued filter matches when any of its values match,
        except `facility`, which requires every listed facility to be available.

        Rig limit filters exclude sites whose recorded limit is smaller than the rig. Sites with
        no recorded limit are included unless `rig_limits_known=true`, because a missing limit is
        unknown, not unlimited.

        With `near`, results are ordered by distance and `distances_km` gives each site's
        distance. Otherwise they are ordered by public ID.
      parameters:
        - name: bbox
          in: query
          description: Bounding box as min longitude, min latitude, max longitude, max latitude (WGS84).
          schema:
            type: string
            pattern: '^-?\d{1,3}(\.\d+)?,-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?,-?\d{1,2}(\.\d+)?$'
          example: 144.9,-37.9,145.2,-37.7
        - name: near
          in: query
          description: Centre point as latitude,longitude (WGS84). Requires radius_km.
          schema:
            type: string
            pattern: '^-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?$'
          example: -14.4521,132.2705
        - name: radius_km
          in: query
          description: Search radius around `near`, in kilometres.
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 250
            default: 25
        - name: site_type
          in: query
          description: Site type codes. A site matches when its primary site type or one of its other site types is listed.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "../schema/common.schema.json#/$defs/SiteTypeCode"
          example: [free_camp, rest_area]
        - name: primary_site_type
          in: query
          description: Site type codes matched against the primary site type only.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "../schema/common.schema.json#/$defs/SiteTypeCode"
        - name: facility
          in: query
          description: Facility codes that must all be available. Codes read from other facts (pets_allowed, dog_off_leash, big_rig_access) work here too.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "../schema/common.schema.json#/$defs/FacilityCode"
          example: [toilets, drinking_water]
        - name: rig_length_m
          in: query
          description: Total length of the rig in metres. Excludes sites whose max_length_m is smaller.
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 60
        - name: rig_height_m
          in: query
          description: Height of the rig in metres. Excludes sites whose max_height_m is smaller.
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 10
        - name: rig_weight_t
          in: query
          description: Gross mass of the rig in tonnes. Excludes sites whose max_weight_t is smaller.
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 200
        - name: rig_limits_known
          in: query
          description: When true, rig limit filters also exclude sites that have no recorded limit for the filtered dimension.
          schema:
            type: boolean
            default: false
        - name: big_rig
          in: query
          description: When true, returns only sites whose big_rig_suitable is yes or limited.
          schema:
            type: boolean
        - name: status
          in: query
          description: Site statuses to include. Merged sites are never listed here.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [active, temporarily_closed, closed]
            default: [active, temporarily_closed]
        - name: country
          in: query
          description: ISO 3166-1 alpha-2 country code.
          schema:
            $ref: "../schema/common.schema.json#/$defs/CountryCode"
        - name: subdivision
          in: query
          description: ISO 3166-2 subdivision code.
          schema:
            $ref: "../schema/common.schema.json#/$defs/SubdivisionCode"
        - name: updated_since
          in: query
          description: Returns only sites changed at or after this time. For reliable incremental sync on paid tiers, follow the change feed instead.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of sites.
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            Link:
              $ref: "#/components/headers/Link"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitePage"
            application/geo+json:
              schema:
                $ref: "#/components/schemas/SiteFeatureCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sites/{site_id}:
    get:
      tags: [Sites]
      operationId: getSite
      summary: Get a site
      description: |
        Returns one site by its public ID. The colons in the ID are allowed in a URL path
        segment and do not need percent-encoding.

        A merged site answers with 301 and a Location header pointing at the surviving site.
        Closed sites are returned normally with status closed: they keep their public ID and
        history.

        Responses carry an ETag. Send it back in If-None-Match to get 304 when nothing changed.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The site.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../schema/site-compact.schema.json"
                  - $ref: "../schema/site.schema.json"
        "301":
          description: The site was merged. Follow Location to the surviving site.
          headers:
            Location:
              description: URL of the surviving site, with the same query string.
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redirect"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/site-types:
    get:
      tags: [Governed lists]
      operationId: listSiteTypes
      summary: List site types
      description: Returns the governed list of site types, with labels, descriptions and OSM and schema.org mappings. The list changes rarely, so cache it and revalidate with If-None-Match.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The site type list.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "../schema/vocabulary.schema.json"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/facilities:
    get:
      tags: [Governed lists]
      operationId: listFacilities
      summary: List facilities
      description: Returns the governed list of facilities, with their attributes, safety fact flags and OSM and schema.org mappings.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The facility list.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "../schema/vocabulary.schema.json"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/downloads:
    get:
      tags: [Bulk downloads]
      operationId: listDownloads
      summary: List bulk downloads
      description: |
        Lists the bulk downloads available to the API key, newest first. Full downloads hold every
        site that is not merged, in the compact form for GeoParquet and in the full form for
        GeoJSON. Delta files hold the changes between two sequence numbers and need a paid tier.

        Download URLs are signed for the API key and expire. Verify each file against its sha256.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [full, delta]
        - name: format
          in: query
          schema:
            type: string
            enum: [geoparquet, geojson, geojsonseq]
        - name: country
          in: query
          schema:
            $ref: "../schema/common.schema.json#/$defs/CountryCode"
        - name: subdivision
          in: query
          schema:
            $ref: "../schema/common.schema.json#/$defs/SubdivisionCode"
        - name: after_seq
          in: query
          description: For delta files, returns only files whose from_seq is greater than or equal to this value.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The available bulk downloads.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/changes:
    get:
      tags: [Change feed]
      operationId: listChanges
      summary: Follow the change feed
      description: |
        Returns changes in sequence order, starting after `after_seq`. Store `next_after_seq` and
        send it as `after_seq` on the next call. Sequence numbers may have gaps, so never count
        on seq + 1. A change whose `previous_seq` differs from the change_seq you hold for that
        site means you missed one: fetch the site again.

        Needs a paid tier. The response for a free key is 403 with problem type tier-required.
      parameters:
        - name: after_seq
          in: query
          description: Return changes with a sequence number greater than this. 0 starts from the beginning of the retained feed.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: site_id
          in: query
          description: Only changes to this site.
          schema:
            $ref: "../schema/common.schema.json#/$defs/SiteId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: A page of changes.
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: after_seq is older than the retained feed. Start again from the latest full bulk download.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Send a submission
      description: |
        Sends a contributor's submission for moderation. A submission never changes live data
        directly. It is accepted into the submission log and answered with 202 and a status URL.
        The moderation decision arrives later, through GET /v1/submissions/{submission_id} or the
        submissionDecided webhook, which is free on every tier.

        Every request needs an Idempotency-Key header. Repeating a request with the same key and
        the same body returns the original response with `Idempotent-Replayed: true`. Reusing a
        key with a different body returns 422.

        Edits are checked for conflicts: when a fact the submission touches has changed since
        `base_change_seq`, the response is 409 with the fields involved and the site's current
        change_seq. Fetch the site, let the contributor review, and submit again.

        Partner apps must obtain each contributor's acceptance of the contributor terms first and
        send it in `consent`. Contributors are identified by pseudonymous ID or OTWD contributor
        ID only, never by name or email.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/submission.schema.json"
      responses:
        "202":
          description: Accepted into the submission log.
          headers:
            Location:
              description: The status URL of the submission.
              schema:
                type: string
                format: uri-reference
            Idempotent-Replayed:
              description: Present and true when this response repeats an earlier one for the same Idempotency-Key.
              schema:
                type: boolean
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A touched fact changed after base_change_seq, or a request with the same Idempotency-Key is still being processed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"
        "422":
          description: The submission does not validate against the schema or the governed lists, or the Idempotency-Key was reused with a different body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/submissions/{submission_id}:
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Get a submission's status
      description: Returns the status of a submission and, once decided, a summary of the moderation decision. Only the partner app that sent the submission, or the direct contributor who made it, can read it.
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            $ref: "../schema/common.schema.json#/$defs/SubmissionId"
      responses:
        "200":
          description: The submission's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/photo-uploads:
    post:
      tags: [Submissions]
      operationId: createPhotoUpload
      summary: Reserve a photo upload
      description: |
        Returns a short-lived URL to upload one image to. Upload the file with the given method
        and headers, then send an add_photo submission that names the upload_id. EXIF location
        data is removed before any photo is published. Uploads not used in a submission within
        24 hours are deleted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUploadRequest"
      responses:
        "201":
          description: Upload slot created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A request with the same Idempotency-Key is still being processed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request does not validate, or the Idempotency-Key was reused with a different body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

webhooks:
  changeApplied:
    post:
      tags: [Change feed]
      operationId: onChangeApplied
      summary: A change was applied
      description: |
        Sent for every change, in sequence order per site, to partner apps on paid tiers that
        registered a webhook endpoint in the developer portal. Delivery is at least once, so
        deduplicate on webhook-id. Failed deliveries are retried with backoff for 3 days, and the
        change feed remains the source of truth for anything missed.

        Verify every request with the Standard Webhooks scheme: compute an HMAC-SHA256 over
        webhook-id, webhook-timestamp and the raw body, joined by full stops, with your endpoint
        secret, compare it with webhook-signature, and reject timestamps more than 5 minutes old.
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAppliedEvent"
      responses:
        "204":
          description: Received. Any 2xx status counts as delivered.
  submissionDecided:
    post:
      tags: [Submissions]
      operationId: onSubmissionDecided
      summary: A submission was decided
      description: Sent to the partner app that made a submission when it receives a moderation decision, including needs_info. Free on every tier, because it belongs to the contribute path, which is always free. Register the endpoint in the developer portal. Delivery, retries and signature verification work as for changeApplied.
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionDecidedEvent"
      responses:
        "204":
          description: Received. Any 2xx status counts as delivered.

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: OTWD-API-Key
      description: Your API key, from the developer portal. Keys are free and required for every request. Never embed a key with submission rights in a public web page.

  parameters:
    SiteId:
      name: site_id
      in: path
      required: true
      description: The site's public ID.
      schema:
        $ref: "../schema/common.schema.json#/$defs/SiteId"
      example: otwd:site:01KR6JW0QBNHM90XV3GS9Y2G26
    View:
      name: view
      in: query
      description: compact returns the compact form, plain values without per-fact provenance (site-compact.schema.json). full returns the full form, every fact with its provenance (site.schema.json).
      schema:
        type: string
        enum: [compact, full]
        default: compact
    Cursor:
      name: cursor
      in: query
      description: The next_cursor value from the previous page. Opaque. Do not build or edit it.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: Maximum number of items on the page.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag from an earlier response. The response is 304 when it still matches.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique value per logical request, such as a UUID, kept for 24 hours. Retries of the same request must reuse it.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    WebhookId:
      name: webhook-id
      in: header
      required: true
      description: Unique ID of the delivery, the same on every retry.
      schema:
        type: string
    WebhookTimestamp:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix time in seconds when the delivery was signed.
      schema:
        type: integer
    WebhookSignature:
      name: webhook-signature
      in: header
      required: true
      description: Space-separated signatures in the form v1,<base64 HMAC-SHA256>. More than one appears while a secret is being rotated.
      schema:
        type: string

  headers:
    RateLimit:
      description: Remaining quota in the current window, as defined by the IETF RateLimit header fields draft, for example "default";r=812;t=34 (812 requests left, window resets in 34 seconds).
      schema:
        type: string
    RateLimitPolicy:
      description: The quota policy applied to the API key, for example "default";q=1000;w=60 (1000 requests per 60 seconds).
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    Link:
      description: RFC 8288 link to the next page, with rel="next", when there is one.
      schema:
        type: string
    ETag:
      description: Entity tag of the representation. For a site it changes whenever change_seq changes.
      schema:
        type: string
    LastModified:
      description: The site's updated_at, in HTTP date form.
      schema:
        type: string
    CacheControl:
      description: Caching rules. Site responses are cacheable for a short time and may be served stale while they revalidate.
      schema:
        type: string
      example: public, max-age=60, stale-while-revalidate=600

  responses:
    BadRequest:
      description: The request is malformed, for example both bbox and near were given.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The API key is missing, unknown or revoked.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The API key's tier does not include this operation, or submissions are closed for the key (problem type tier-required or contributions-closed).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource, or it is not visible to this API key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotModified:
      description: The representation has not changed since the ETag given in If-None-Match.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    TooManyRequests:
      description: The API key's rate limit or quota is used up.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimitPolicy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServerError:
      description: An unexpected error. Quote request_id when reporting it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      description: RFC 9457 problem details. The type URI identifies the problem and links to its documentation.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://opentouring.org/problems/tier-required
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          description: ID of the request in OTWD's logs.
          type: string
      additionalProperties: true
    ValidationProblem:
      description: A problem with the list of validation errors found.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [pointer, message]
                properties:
                  pointer:
                    description: JSON Pointer to the offending part of the request body.
                    type: string
                  message:
                    type: string
    ConflictProblem:
      description: A problem describing a conflict with newer changes to the site.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            current_change_seq:
              $ref: "../schema/common.schema.json#/$defs/ChangeSeq"
            conflicting_fields:
              description: JSON Pointers to the touched facts that changed after base_change_seq.
              type: array
              items:
                type: string
    Redirect:
      description: Body of a 301 for a merged site.
      type: object
      required: [redirect_to, location]
      properties:
        redirect_to:
          $ref: "../schema/common.schema.json#/$defs/SiteId"
        location:
          type: string
          format: uri-reference
    SitePage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: "../schema/site-compact.schema.json"
              - $ref: "../schema/site.schema.json"
        next_cursor:
          description: Cursor for the next page, or null on the last page.
          type: [string, "null"]
        distances_km:
          description: With near only. Distance from the centre to each listed site, by public ID.
          type: object
          additionalProperties:
            type: number
            minimum: 0
        attribution:
          description: The credit to show with these sites.
          type: string
          example: "Data: Open Touring contributors, opentouring.org, CC BY 4.0"
    SiteFeatureCollection:
      description: The same page as GeoJSON (RFC 7946). Each feature is a Point whose properties are the compact site form. next_cursor and attribution are foreign members.
      type: object
      required: [type, features, next_cursor]
      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type:
                const: Feature
              id:
                $ref: "../schema/common.schema.json#/$defs/SiteId"
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type:
                    const: Point
                  coordinates:
                    description: Longitude, latitude.
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: number
              properties:
                $ref: "../schema/site-compact.schema.json"
        next_cursor:
          type: [string, "null"]
        attribution:
          type: string
    Download:
      type: object
      required:
        [id, kind, format, url, size_bytes, sha256, generated_at, schema_version, to_seq, licence]
      properties:
        id:
          type: string
          example: au-full-20261016-geoparquet
        kind:
          type: string
          enum: [full, delta]
        format:
          type: string
          enum: [geoparquet, geojson, geojsonseq]
        url:
          description: Signed HTTPS URL on the CDN, valid until expires_at.
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          description: SHA-256 of the file.
          $ref: "../schema/common.schema.json#/$defs/Sha256"
        generated_at:
          type: string
          format: date-time
        schema_version:
          type: string
          example: "1.0"
        from_seq:
          description: For delta files, the first sequence number included is greater than this.
          type: integer
          minimum: 0
        to_seq:
          description: The last sequence number included. A full download contains every change up to it.
          $ref: "../schema/common.schema.json#/$defs/ChangeSeq"
        record_count:
          type: integer
          minimum: 0
        country_code:
          $ref: "../schema/common.schema.json#/$defs/CountryCode"
        subdivision_code:
          $ref: "../schema/common.schema.json#/$defs/SubdivisionCode"
        licence:
          const: CC-BY-4.0
    DownloadList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Download"
    ChangePage:
      type: object
      required: [data, next_after_seq, latest_seq, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "../schema/change.schema.json"
        next_after_seq:
          description: Send as after_seq on the next call. Equal to the request's after_seq when the page is empty.
          type: integer
          minimum: 0
        latest_seq:
          description: The highest sequence number applied so far.
          type: integer
          minimum: 0
        has_more:
          type: boolean
    SubmissionAccepted:
      type: object
      required: [submission_id, status, status_url, received_at]
      properties:
        submission_id:
          $ref: "../schema/common.schema.json#/$defs/SubmissionId"
        status:
          const: received
        status_url:
          type: string
          format: uri
        received_at:
          type: string
          format: date-time
        partner_reference:
          type: string
    SubmissionStatus:
      type: object
      required: [submission_id, kind, status, received_at, updated_at]
      properties:
        submission_id:
          $ref: "../schema/common.schema.json#/$defs/SubmissionId"
        kind:
          type: string
          enum: [new_site, update_facts, add_photo, report_closure, request_merge, report_problem]
        site_id:
          description: The site concerned. For an approved new_site, the new site's public ID.
          $ref: "../schema/common.schema.json#/$defs/SiteId"
        partner_reference:
          type: string
        status:
          description: received, checking (fixed checks and AI review), in_review (waiting for a moderator), needs_info (waiting for the contributor), approved, edited_and_approved or rejected.
          type: string
          enum: [received, checking, in_review, needs_info, approved, edited_and_approved, rejected]
        received_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        decision:
          $ref: "#/components/schemas/DecisionSummary"
    DecisionSummary:
      description: What a partner app may show its contributor about a moderation decision. The full decision record, including verdicts and moderator identity, is not exposed.
      type: object
      required: [decision_id, outcome, decided_at]
      properties:
        decision_id:
          $ref: "../schema/common.schema.json#/$defs/DecisionId"
        outcome:
          type: string
          enum: [approved, edited_and_approved, rejected, needs_info]
        decided_at:
          type: string
          format: date-time
        decided_by_kind:
          type: string
          enum: [moderator, routing_rule]
        reason_codes:
          type: array
          items:
            type: string
        public_note:
          type: string
        change_seqs:
          type: array
          items:
            $ref: "../schema/common.schema.json#/$defs/ChangeSeq"
        appealable_until:
          description: Last moment the contributor can appeal through the Open Touring website.
          type: string
          format: date-time
    PhotoUploadRequest:
      type: object
      required: [content_type, size_bytes, sha256]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic]
        size_bytes:
          type: integer
          minimum: 1
          maximum: 20000000
        sha256:
          $ref: "../schema/common.schema.json#/$defs/Sha256"
      additionalProperties: false
    PhotoUpload:
      type: object
      required: [upload_id, upload_url, method, expires_at]
      properties:
        upload_id:
          $ref: "../schema/common.schema.json#/$defs/UploadId"
        upload_url:
          type: string
          format: uri
        method:
          const: PUT
        headers:
          description: Headers to send with the upload, exactly as given.
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    ChangeAppliedEvent:
      type: object
      required: [type, created_at, data]
      properties:
        type:
          const: change.applied
        created_at:
          type: string
          format: date-time
        data:
          $ref: "../schema/change.schema.json"
    SubmissionDecidedEvent:
      type: object
      required: [type, created_at, data]
      properties:
        type:
          const: submission.decided
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/SubmissionStatus"

# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: OTWD API
  version: 1.0.0-draft
  summary: Read Open Touring records and send contributors' submissions back for moderation.
  description: |
    The OTWD API serves the Open Touring and Waypoint Database: the sites travellers stop at on
    the road, such as campsites, caravan parks, free camps, rest areas, dump points, water and
    toilets, and what a traveller needs to know about getting there: road restrictions such as
    low bridges and weight limits, road segments with their surface and vehicle access class, and
    ferry services with the vehicles they carry. Partner apps read records, governed lists, bulk
    downloads and the change feed, and send their contributors' submissions, which are moderated
    before they become changes.

    Sites, road restrictions, road segments and ferry services are the four record types. They
    share public IDs, facts with provenance, compact and full views, closures, merges, the change
    feed and submissions, so everything below about sites applies to all four. Sites and road
    restrictions are points. Road segments and ferry services are lines. OTWD serves no map tiles.

    ## Rig filters

    The rig_ parameters describe the traveller's rig the same way on every list endpoint: its
    length (including anything towed), height, width, gross mass and heaviest axle load. Each is
    compared with the matching limit of the record type, and the lowest_m figure of a vertical
    clearance or width limit, which is the lowest figure of any basis. The direction depends on
    what the record is:

    - Sites, road segments and ferry services answer "which of these can my rig use". A record
      whose recorded limit is below the rig is left out. A record with no recorded limit for a
      dimension stays in unless `rig_limits_known=true`, because a missing limit is unknown, not
      unlimited.
    - Road restrictions are the obstacles themselves, so they answer "which of these would stop
      my rig". Only restrictions whose recorded limit is below the rig in at least one given
      dimension are returned. An empty result is not proof a route is clear, because a limit
      that was never recorded is unknown.

    Filters on other facts follow one pattern: a filter on a fact leaves records where the fact
    is unknown in, and the matching `<fact>_known=true` parameter takes them out.

    Every request needs an API key, including bulk downloads. Keys are free. Paid tiers add
    volume, the change feed and its changeApplied webhook, delta files, a service level and
    support. Contributing is free on every tier, and that includes the submissionDecided webhook,
    which reports the outcome of a partner app's own submissions.

    ## Languages

    Governed list endpoints honour `Accept-Language`. Labels and descriptions are written in en-AU,
    the reference language, and translated by contributors. A missing translation falls back from
    the requested tag to its base language and then to en-AU, so a label is never blank. The
    response carries `Content-Language` and `Vary: Accept-Language`.

    Record responses are not translated. They carry codes, which apps label from the governed
    lists in the traveller's language, and free text such as names, descriptions and notes in the
    language the contributor wrote, with its `lang` tag. An app that shows a machine translation
    of free text marks it as machine translated, and never submits it back as a fact.

    ## Attribution

    OTWD data is licensed under the Creative Commons Attribution 4.0 International licence
    (CC BY 4.0). Anything that shows OTWD data must credit it where the data is shown, for example
    in a map footer, an about screen or next to the site details:

    > Data: Open Touring contributors, opentouring.org, CC BY 4.0

    Some facts come from seed sources whose licences need their own credit. Every record in the
    compact form lists the credits it needs in `attribution`, and every fact in the full form
    carries its seed source's `attribution` in its provenance. Show those credits too. Photos carry
    their own `attribution`, which must be shown with the photo.

    ## Licences

    The data is CC BY 4.0. This specification and the OTWD JSON Schema it uses are Apache-2.0.
  termsOfService: https://opentouring.org/terms
  contact:
    name: Open Touring
    url: https://opentouring.org
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-data-licence:
    name: CC BY 4.0
    identifier: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Data: Open Touring contributors, opentouring.org, CC BY 4.0"

servers:
  - url: https://api.opentouring.org
    description: Production

security:
  - ApiKey: []

tags:
  - name: Sites
    description: Read sites, by area or by public ID.
  - name: Road restrictions
    description: Read road restrictions, points where a physical or legal limit applies to vehicles, by area, along a route or by public ID.
  - name: Road segments
    description: Read road segments, stretches of road or track with their surface, vehicle access class, towing and closures, by area, along a route or by public ID.
  - name: Ferry services
    description: Read ferry services, crossings between two ferry terminals with the vehicles they carry, their limits and fares.
  - name: Governed lists
    description: The site types, facilities, structures, surfaces, vehicle access classes and vehicle classes records are described with.
  - name: Bulk downloads
    description: The whole dataset, or the changes between two sequence numbers, as files.
  - name: Change feed
    description: Every change applied to the live data, in order. Paid tiers.
  - name: Submissions
    description: Send a contributor's new records, corrections, photos, closures, merge requests and problem reports for moderation.

paths:
  /v1/sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List sites
      description: |
        Returns sites in an area, with optional filters. Give either `bbox` or `near`, not both.
        Without either, the whole dataset is paged through in public ID order, which suits a first
        sync, although a bulk download is faster for that.

        Filters combine with AND. A list-valued filter matches when any of its values match,
        except `facility`, which requires every listed facility to be available.

        Rig filters leave out sites whose rig limits are below the rig. Sites with no recorded
        limit stay in unless `rig_limits_known=true`. See Rig filters above.

        With `near`, results are ordered by distance and `distances_km` gives each site's
        distance. Otherwise they are ordered by public ID.
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Near"
        - $ref: "#/components/parameters/RadiusKm"
        - name: site_type
          in: query
          description: Site type codes. A site matches when its primary site type or one of its other site types is listed.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "../schema/common.schema.json#/$defs/SiteTypeCode"
          example: [free_camp, rest_area]
        - name: primary_site_type
          in: query
          description: Site type codes matched against the primary site type only.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "../schema/common.schema.json#/$defs/SiteTypeCode"
        - name: facility
          in: query
          description: Facility codes that must all be available. Codes read from other facts (pets_allowed, dog_off_leash, big_rig_access) work here too.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "../schema/common.schema.json#/$defs/FacilityCode"
          example: [toilets, drinking_water]
        - $ref: "#/components/parameters/RigLengthM"
        - $ref: "#/components/parameters/RigHeightM"
        - $ref: "#/components/parameters/RigWeightT"
        - $ref: "#/components/parameters/RigLimitsKnown"
        - name: big_rig
          in: query
          description: When true, returns only sites whose big_rig_suitable is yes or limited.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Subdivision"
        - $ref: "#/components/parameters/UpdatedSince"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of sites.
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            Link:
              $ref: "#/components/headers/Link"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitePage"
            application/geo+json:
              schema:
                $ref: "#/components/schemas/SiteFeatureCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sites/{site_id}:
    get:
      tags: [Sites]
      operationId: getSite
      summary: Get a site
      description: |
        Returns one site by its public ID. The colons in the ID are allowed in a URL path
        segment and do not need percent-encoding.

        A merged site answers with 301 and a Location header pointing at the surviving site.
        Closed sites are returned normally with status closed: they keep their public ID and
        history.

        Responses carry an ETag. Send it back in If-None-Match to get 304 when nothing changed.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The site.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../schema/site-compact.schema.json"
                  - $ref: "../schema/site.schema.json"
        "301":
          $ref: "#/components/responses/MergedRecord"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/site-types:
    get:
      tags: [Governed lists]
      operationId: listSiteTypes
      summary: List site types
      description: Returns the governed list of site types, with labels, descriptions and OSM and schema.org mappings. Labels and descriptions are in the language asked for in Accept-Language, with en-AU as the fallback. The list changes rarely, so cache it and revalidate with If-None-Match.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The site type list.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            Vary:
              $ref: "#/components/headers/Vary"
          content:
            application/json:
              schema:
                $ref: "../schema/vocabulary.schema.json"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/facilities:
    get:
      tags: [Governed lists]
      operationId: listFacilities
      summary: List facilities
      description: Returns the governed list of facilities, with their attributes, safety fact flags and OSM and schema.org mappings.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The facility list.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            Vary:
              $ref: "#/components/headers/Vary"
          content:
            application/json:
              schema:
                $ref: "../schema/vocabulary.schema.json"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/road-restrictions:
    get:
      tags: [Road restrictions]
      operationId: listRoadRestrictions
      summary: List road restrictions
      description: |
        Returns road restrictions in an area or along a route. Give one of `bbox`, `near` or
        `route`. With `route`, results are ordered by distance along the route and
        `route_positions_km` gives each record's position. With `near`, they are ordered by
        distance. Otherwise they are ordered by public ID.

        The rig filters answer "which of these would stop my rig". With any rig_ parameter, only
        road restrictions with a recorded limit below the rig in at least one given dimension are
        returned. Vertical clearance and width limit are compared using `lowest_m`, the lowest figure of
        any basis, so a measured figure below the sign counts. A restriction with no recorded
        limit for a dimension is never returned for that dimension, so an empty result is not
        proof a route is clear: the absent limit is unknown. See Rig filters above.
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Near"
        - $ref: "#/components/parameters/RadiusKm"
        - $ref: "#/components/parameters/Route"
        - $ref: "#/components/parameters/CorridorM"
        - name: structure
          in: query
          description: Structure codes to include.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "../schema/common.schema.json#/$defs/StructureCode"
        - $ref: "#/components/parameters/RigLengthM"
        - $ref: "#/components/parameters/RigHeightM"
        - $ref: "#/components/parameters/RigWidthM"
        - $ref: "#/components/parameters/RigWeightT"
        - $ref: "#/components/parameters/RigAxleLoadT"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Subdivision"
        - $ref: "#/components/parameters/UpdatedSince"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of road restrictions.
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            Link:
              $ref: "#/components/headers/Link"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadRestrictionPage"
            application/geo+json:
              schema:
                $ref: "#/components/schemas/RoadRestrictionFeatureCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/road-restrictions/{road_restriction_id}:
    get:
      tags: [Road restrictions]
      operationId: getRoadRestriction
      summary: Get a road restriction
      description: |
        Returns one road restriction by its public ID. A merged record answers with 301 and a
        Location header pointing at the surviving one, and a closed record is returned with
        status closed, exactly as for sites. Responses carry an ETag for If-None-Match.
      parameters:
        - $ref: "#/components/parameters/RoadRestrictionId"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The road restriction.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../schema/road-restriction-compact.schema.json"
                  - $ref: "../schema/road-restriction.schema.json"
        "301":
          $ref: "#/components/responses/MergedRecord"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/road-segments:
    get:
      tags: [Road segments]
      operationId: listRoadSegments
      summary: List road segments
      description: |
        Returns road segments that cross an area or run along a route. Give one of `bbox`,
        `near` or `route`. A segment matches when any part of its geometry is inside the area or
        the route's corridor. With `route`, results are ordered by where they first meet the
        route, and `route_positions_km` gives that position.

        `vehicle_access_class` returns only segments whose class ranks at or below the given
        class, so `four_wd_high_clearance` returns segments a high-clearance 4WD can use.
        `towing_permitted` returns only segments with one of the given values. Rig filters leave
        out segments whose weight or length limit is below the rig. Segments where the filtered
        fact is unknown stay in unless the matching `_known` parameter is true. See Rig filters
        above.
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Near"
        - $ref: "#/components/parameters/RadiusKm"
        - $ref: "#/components/parameters/Route"
        - $ref: "#/components/parameters/CorridorM"
        - name: surface
          in: query
          description: Surface codes to include.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "../schema/common.schema.json#/$defs/SurfaceCode"
        - name: vehicle_access_class
          in: query
          description: The most restrictive vehicle access class to include.
          schema:
            $ref: "../schema/common.schema.json#/$defs/VehicleAccessClassCode"
        - name: vehicle_access_class_known
          in: query
          description: When true, excludes segments with no recorded vehicle access class.
          schema:
            type: boolean
            default: false
        - name: towing_permitted
          in: query
          description: Towing permitted values to include, for example yes,not_recommended to leave out segments where towing is prohibited.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 3
            items:
              type: string
              enum: [yes, not_recommended, no]
        - name: towing_permitted_known
          in: query
          description: When true, excludes segments with no recorded towing permitted.
          schema:
            type: boolean
            default: false
        - name: has_seasonal_closure
          in: query
          description: When true, returns only segments with a recorded seasonal closure. When false, only segments without one.
          schema:
            type: boolean
        - $ref: "#/components/parameters/RigLengthM"
        - $ref: "#/components/parameters/RigWeightT"
        - $ref: "#/components/parameters/RigAxleLoadT"
        - $ref: "#/components/parameters/RigLimitsKnown"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Subdivision"
        - $ref: "#/components/parameters/UpdatedSince"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of road segments.
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            Link:
              $ref: "#/components/headers/Link"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadSegmentPage"
            application/geo+json:
              schema:
                $ref: "#/components/schemas/RoadSegmentFeatureCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/road-segments/{road_segment_id}:
    get:
      tags: [Road segments]
      operationId: getRoadSegment
      summary: Get a road segment
      description: |
        Returns one road segment by its public ID. A merged record answers with 301 and a
        Location header pointing at the surviving one, and a closed record is returned with
        status closed, exactly as for sites. Responses carry an ETag for If-None-Match.
      parameters:
        - $ref: "#/components/parameters/RoadSegmentId"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The road segment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../schema/road-segment-compact.schema.json"
                  - $ref: "../schema/road-segment.schema.json"
        "301":
          $ref: "#/components/responses/MergedRecord"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/ferry-services:
    get:
      tags: [Ferry services]
      operationId: listFerryServices
      summary: List ferry services
      description: |
        Returns ferry services in an area, along a route, or from one ferry terminal. Give one of
        `bbox`, `near`, `route` or `terminal`.

        `vehicle_class` returns only services that carry every listed class. Rig filters leave
        out services whose ferry vehicle limits are below the rig, using the limits for a listed
        vehicle class when they are recorded. Services with no recorded limit stay in unless
        `rig_limits_known=true`. See Rig filters above.
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Near"
        - $ref: "#/components/parameters/RadiusKm"
        - $ref: "#/components/parameters/Route"
        - $ref: "#/components/parameters/CorridorM"
        - name: terminal
          in: query
          description: A ferry terminal site. Returns the services that call there.
          schema:
            $ref: "../schema/common.schema.json#/$defs/SiteId"
        - name: vehicle_class
          in: query
          description: Vehicle class codes the service must all carry.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 10
            items:
              $ref: "../schema/common.schema.json#/$defs/VehicleClassCode"
          example: [car_towing]
        - $ref: "#/components/parameters/RigLengthM"
        - $ref: "#/components/parameters/RigHeightM"
        - $ref: "#/components/parameters/RigWidthM"
        - $ref: "#/components/parameters/RigWeightT"
        - $ref: "#/components/parameters/RigLimitsKnown"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Subdivision"
        - $ref: "#/components/parameters/UpdatedSince"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of ferry services.
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            Link:
              $ref: "#/components/headers/Link"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FerryServicePage"
            application/geo+json:
              schema:
                $ref: "#/components/schemas/FerryServiceFeatureCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/ferry-services/{ferry_service_id}:
    get:
      tags: [Ferry services]
      operationId: getFerryService
      summary: Get a ferry service
      description: |
        Returns one ferry service by its public ID. A merged record answers with 301 and a
        Location header pointing at the surviving one, and a closed record is returned with
        status closed, exactly as for sites. Responses carry an ETag for If-None-Match.
      parameters:
        - $ref: "#/components/parameters/FerryServiceId"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The ferry service.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../schema/ferry-service-compact.schema.json"
                  - $ref: "../schema/ferry-service.schema.json"
        "301":
          $ref: "#/components/responses/MergedRecord"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/structures:
    get:
      tags: [Governed lists]
      operationId: listStructures
      summary: List structures
      description: Returns the governed list of structures found at road restrictions, with the passages each allows and OSM mappings.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          $ref: "#/components/responses/GovernedList"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/surfaces:
    get:
      tags: [Governed lists]
      operationId: listSurfaces
      summary: List surfaces
      description: Returns the governed list of road segment surfaces, with OSM surface and tracktype mappings.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          $ref: "#/components/responses/GovernedList"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/vehicle-access-classes:
    get:
      tags: [Governed lists]
      operationId: listVehicleAccessClasses
      summary: List vehicle access classes
      description: Returns the governed list of vehicle access classes in rank order, from 2WD to closed to vehicles, with OSM mappings.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          $ref: "#/components/responses/GovernedList"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/vehicle-classes:
    get:
      tags: [Governed lists]
      operationId: listVehicleClasses
      summary: List vehicle classes
      description: Returns the governed list of vehicle classes used by ferry services, with OSM access mappings.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          $ref: "#/components/responses/GovernedList"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/downloads:
    get:
      tags: [Bulk downloads]
      operationId: listDownloads
      summary: List bulk downloads
      description: |
        Lists the bulk downloads available to the API key, newest first. Each file holds one record
        type. Full downloads hold every record of that type that is not merged, in the compact form
        for GeoParquet and in the full form for GeoJSON, with point geometry for sites and road
        restrictions and line geometry for road segments and ferry services. Delta files hold the
        changes between two sequence numbers and need a paid tier.

        Download URLs are signed for the API key and expire. Verify each file against its sha256.
      parameters:
        - name: record_type
          in: query
          schema:
            $ref: "../schema/common.schema.json#/$defs/RecordType"
        - name: kind
          in: query
          schema:
            type: string
            enum: [full, delta]
        - name: format
          in: query
          schema:
            type: string
            enum: [geoparquet, geojson, geojsonseq]
        - name: country
          in: query
          schema:
            $ref: "../schema/common.schema.json#/$defs/CountryCode"
        - name: subdivision
          in: query
          schema:
            $ref: "../schema/common.schema.json#/$defs/SubdivisionCode"
        - name: after_seq
          in: query
          description: For delta files, returns only files whose from_seq is greater than or equal to this value.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The available bulk downloads.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/changes:
    get:
      tags: [Change feed]
      operationId: listChanges
      summary: Follow the change feed
      description: |
        Returns changes in sequence order, starting after `after_seq`. Store `next_after_seq` and
        send it as `after_seq` on the next call. Sequence numbers may have gaps, so never count
        on seq + 1. A change whose `previous_seq` differs from the change_seq you hold for that
        record means you missed one: fetch the record again. The feed covers every record type.

        Needs a paid tier. The response for a free key is 403 with problem type tier-required.
      parameters:
        - name: after_seq
          in: query
          description: Return changes with a sequence number greater than this. 0 starts from the beginning of the retained feed.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: record_id
          in: query
          description: Only changes to this record, of any record type.
          schema:
            $ref: "../schema/common.schema.json#/$defs/RecordId"
        - name: record_type
          in: query
          description: Only changes to records of these types.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "../schema/common.schema.json#/$defs/RecordType"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: A page of changes.
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: after_seq is older than the retained feed. Start again from the latest full bulk download.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Send a submission
      description: |
        Sends a contributor's submission for moderation. A submission never changes live data
        directly. It is accepted into the submission log and answered with 202 and a status URL.
        The moderation decision arrives later, through GET /v1/submissions/{submission_id} or the
        submissionDecided webhook, which is free on every tier.

        Every request needs an Idempotency-Key header. Repeating a request with the same key and
        the same body returns the original response with `Idempotent-Replayed: true`. Reusing a
        key with a different body returns 422.

        A submission can create any record type (new_site, new_road_restriction, new_road_segment,
        new_ferry_service). The kinds that change an existing record name it in `record_id`, for
        every record type. New records, closures, merges and changes to safety facts always go to
        a moderator.

        Edits are checked for conflicts: when a fact the submission touches has changed since
        `base_change_seq`, the response is 409 with the fields involved and the record's current
        change_seq. Fetch the record, let the contributor review, and submit again.

        Partner apps must obtain each contributor's acceptance of the contributor terms first and
        send it in `consent`. Contributors are identified by pseudonymous ID or OTWD contributor
        ID only, never by name or email.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/submission.schema.json"
      responses:
        "202":
          description: Accepted into the submission log.
          headers:
            Location:
              description: The status URL of the submission.
              schema:
                type: string
                format: uri-reference
            Idempotent-Replayed:
              description: Present and true when this response repeats an earlier one for the same Idempotency-Key.
              schema:
                type: boolean
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A touched fact changed after base_change_seq, or a request with the same Idempotency-Key is still being processed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"
        "422":
          description: The submission does not validate against the schema or the governed lists, or the Idempotency-Key was reused with a different body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/submissions/{submission_id}:
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Get a submission's status
      description: Returns the status of a submission and, once decided, a summary of the moderation decision. Only the partner app that sent the submission, or the direct contributor who made it, can read it.
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            $ref: "../schema/common.schema.json#/$defs/SubmissionId"
      responses:
        "200":
          description: The submission's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/photo-uploads:
    post:
      tags: [Submissions]
      operationId: createPhotoUpload
      summary: Reserve a photo upload
      description: |
        Returns a short-lived upload URL on the API host and an upload_id. PUT the image there
        with the given headers: the API receives the file, checks its size, type and SHA-256,
        strips EXIF location data and only then writes it to storage. The URL is never a
        presigned URL for the storage service itself, so no file reaches storage unchecked. Then
        send an add_photo submission, about a record of any type, that names the upload_id.
        Uploads not used in a submission within 24 hours are deleted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUploadRequest"
      responses:
        "201":
          description: Upload slot created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A request with the same Idempotency-Key is still being processed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request does not validate, or the Idempotency-Key was reused with a different body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

webhooks:
  changeApplied:
    post:
      tags: [Change feed]
      operationId: onChangeApplied
      summary: A change was applied
      description: |
        Sent for every change, in sequence order per record, to partner apps on paid tiers that
        registered a webhook endpoint in the developer portal. Delivery is at least once, so
        deduplicate on webhook-id. Failed deliveries are retried with backoff for 3 days, and the
        change feed remains the source of truth for anything missed.

        Verify every request with the Standard Webhooks scheme: compute an HMAC-SHA256 over
        webhook-id, webhook-timestamp and the raw body, joined by full stops, with your endpoint
        secret, compare it with webhook-signature, and reject timestamps more than 5 minutes old.
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAppliedEvent"
      responses:
        "204":
          description: Received. Any 2xx status counts as delivered.
  submissionDecided:
    post:
      tags: [Submissions]
      operationId: onSubmissionDecided
      summary: A submission was decided
      description: Sent to the partner app that made a submission when it receives a moderation decision, including needs_info. Free on every tier, because it belongs to the contribute path, which is always free. Register the endpoint in the developer portal. Delivery, retries and signature verification work as for changeApplied.
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionDecidedEvent"
      responses:
        "204":
          description: Received. Any 2xx status counts as delivered.

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: OTWD-API-Key
      description: Your API key, from the developer portal. Keys are free and required for every request. Never embed a key with submission rights in a public web page.

  parameters:
    Bbox:
      name: bbox
      in: query
      description: Bounding box as min longitude, min latitude, max longitude, max latitude (WGS84).
      schema:
        type: string
        pattern: '^-?\d{1,3}(\.\d+)?,-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?,-?\d{1,2}(\.\d+)?$'
      example: 144.9,-37.9,145.2,-37.7
    Near:
      name: near
      in: query
      description: Centre point as latitude,longitude (WGS84). Requires radius_km.
      schema:
        type: string
        pattern: '^-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?$'
      example: -14.4521,132.2705
    RadiusKm:
      name: radius_km
      in: query
      description: Search radius around `near`, in kilometres.
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 250
        default: 25
    Route:
      name: route
      in: query
      description: |
        The route's geometry, encoded in Google's Encoded Polyline Algorithm Format (precision 5,
        latitude first), matched with a corridor of `corridor_m` either side. Simplify long routes
        to about 50 m tolerance first, and split a route longer than the query string allows into
        legs. OTWD never stores the route.
      schema:
        type: string
        minLength: 4
        maxLength: 16000
      example: "_p~iF~ps|U_ulLnnqC_mqNvxq`@"
    CorridorM:
      name: corridor_m
      in: query
      description: Width of the corridor, the band either side of `route` within which a record counts as along it, in metres.
      schema:
        type: number
        minimum: 5
        maximum: 5000
        default: 30
    Status:
      name: status
      in: query
      description: Record statuses to include. Merged records are never listed.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [active, temporarily_closed, closed]
        default: [active, temporarily_closed]
    Country:
      name: country
      in: query
      description: ISO 3166-1 alpha-2 country code.
      schema:
        $ref: "../schema/common.schema.json#/$defs/CountryCode"
    Subdivision:
      name: subdivision
      in: query
      description: ISO 3166-2 subdivision code.
      schema:
        $ref: "../schema/common.schema.json#/$defs/SubdivisionCode"
    UpdatedSince:
      name: updated_since
      in: query
      description: Returns only records changed at or after this instant, in UTC with the Z suffix. For reliable incremental sync on paid tiers, follow the change feed instead.
      schema:
        $ref: "#/components/schemas/Timestamp"
    RigLengthM:
      name: rig_length_m
      in: query
      description: Total length of the rig in metres, including anything towed. Compared with a site's rig_limits.max_length_m, a ferry service's vehicle_limits.max_length_m, and the length_limit.signed_m of a road restriction or road segment.
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 60
    RigHeightM:
      name: rig_height_m
      in: query
      description: Height of the rig in metres. Compared with a site's rig_limits.max_height_m, a ferry service's vehicle_limits.max_height_m, and a road restriction's vertical_clearance.lowest_m.
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 10
    RigWidthM:
      name: rig_width_m
      in: query
      description: Width of the rig in metres. Compared with a ferry service's vehicle_limits.max_width_m and a road restriction's width_limit.lowest_m.
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 10
    RigWeightT:
      name: rig_weight_t
      in: query
      description: Gross mass of the rig in tonnes. Compared with a site's rig_limits.max_weight_t, a ferry service's vehicle_limits.max_weight_t, and the weight_limit.gross_t of a road restriction or road segment.
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 200
    RigAxleLoadT:
      name: rig_axle_load_t
      in: query
      description: Heaviest axle load of the rig in tonnes. Compared with the weight_limit.axle_load_t of a road restriction or road segment.
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 50
    RigLimitsKnown:
      name: rig_limits_known
      in: query
      description: When true, rig filters on sites, road segments and ferry services also exclude records with no recorded limit for a filtered dimension. Road restrictions are only ever returned for a recorded limit, so it does not apply to them.
      schema:
        type: boolean
        default: false
    RoadRestrictionId:
      name: road_restriction_id
      in: path
      required: true
      description: The road restriction's public ID.
      schema:
        $ref: "../schema/common.schema.json#/$defs/RoadRestrictionId"
    RoadSegmentId:
      name: road_segment_id
      in: path
      required: true
      description: The road segment's public ID.
      schema:
        $ref: "../schema/common.schema.json#/$defs/RoadSegmentId"
    FerryServiceId:
      name: ferry_service_id
      in: path
      required: true
      description: The ferry service's public ID.
      schema:
        $ref: "../schema/common.schema.json#/$defs/FerryServiceId"
    SiteId:
      name: site_id
      in: path
      required: true
      description: The site's public ID.
      schema:
        $ref: "../schema/common.schema.json#/$defs/SiteId"
      example: otwd:site:01KR6JW0QBNHM90XV3GS9Y2G26
    View:
      name: view
      in: query
      description: compact returns the compact form, plain values without per-fact provenance (for example site-compact.schema.json). full returns the full form, every fact with its provenance (for example site.schema.json).
      schema:
        type: string
        enum: [compact, full]
        default: compact
    Cursor:
      name: cursor
      in: query
      description: The next_cursor value from the previous page. Opaque. Do not build or edit it.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: Maximum number of items on the page.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag from an earlier response. The response is 304 when it still matches.
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: The languages the reader prefers, as in RFC 9110, for example de-AT, de;q=0.8. Governed list labels and descriptions are served in the best match. A missing translation falls back from the tag to its base language (de-AT to de) and then to en-AU, the reference language, and the entry names the language it fell back to in label_lang or description_lang. Without this header the list is served in en-AU.
      schema:
        type: string
        maxLength: 200
      example: de-AT, de;q=0.8, en;q=0.5
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique value per logical request, such as a UUID, kept for 24 hours. Retries of the same request must reuse it.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    WebhookId:
      name: webhook-id
      in: header
      required: true
      description: Unique ID of the delivery, the same on every retry.
      schema:
        type: string
    WebhookTimestamp:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix time in seconds when the delivery was signed, which counts from the epoch in UTC.
      schema:
        type: integer
    WebhookSignature:
      name: webhook-signature
      in: header
      required: true
      description: Space-separated signatures in the form v1,<base64 HMAC-SHA256>. More than one appears while a secret is being rotated.
      schema:
        type: string

  headers:
    RateLimit:
      description: Remaining quota in the current window, as defined by the IETF RateLimit header fields draft, for example "default";r=812;t=34 (812 requests left, window resets in 34 seconds).
      schema:
        type: string
    RateLimitPolicy:
      description: The quota policy applied to the API key, for example "default";q=1000;w=60 (1000 requests per 60 seconds).
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    Link:
      description: RFC 8288 link to the next page, with rel="next", when there is one.
      schema:
        type: string
    ETag:
      description: Entity tag of the representation. For a record it changes whenever change_seq changes.
      schema:
        type: string
    ContentLanguage:
      description: The language the governed list was served in, the same as its language field. Entries with no translation in it say so in label_lang or description_lang.
      schema:
        type: string
      example: de
    Vary:
      description: Accept-Language for governed lists, so caches keep one copy per language. The ETag differs between languages.
      schema:
        type: string
      example: Accept-Language
    LastModified:
      description: The record's updated_at, in HTTP date form, which is always GMT.
      schema:
        type: string
    CacheControl:
      description: Caching rules. Site responses are cacheable for a short time and may be served stale while they revalidate.
      schema:
        type: string
      example: public, max-age=60, stale-while-revalidate=600

  responses:
    BadRequest:
      description: The request is malformed, for example both bbox and near were given.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The API key is missing, unknown or revoked.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The API key's tier does not include this operation, or submissions are closed for the key (problem type tier-required or contributions-closed).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource, or it is not visible to this API key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotModified:
      description: The representation has not changed since the ETag given in If-None-Match.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    TooManyRequests:
      description: The API key's rate limit or quota is used up.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimitPolicy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MergedRecord:
      description: The record was merged. Follow Location to the surviving record.
      headers:
        Location:
          description: URL of the surviving record, with the same query string.
          schema:
            type: string
            format: uri-reference
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Redirect"
    GovernedList:
      description: The governed list.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Content-Language:
          $ref: "#/components/headers/ContentLanguage"
        Vary:
          $ref: "#/components/headers/Vary"
      content:
        application/json:
          schema:
            $ref: "../schema/vocabulary.schema.json"
    ServerError:
      description: An unexpected error. Quote request_id when reporting it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Timestamp:
      description: An instant in RFC 3339 form in UTC with the Z suffix, for example 2026-09-08T23:10:00Z. Every time the API sends or accepts as an instant uses it, including the change feed and webhook payloads. Offsets other than Z are rejected. Opening hours, timetables and other local schedules are local clock times, never Timestamps.
      $ref: "../schema/common.schema.json#/$defs/Timestamp"
    Problem:
      description: RFC 9457 problem details. The type URI identifies the problem and links to its documentation.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://opentouring.org/problems/tier-required
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          description: ID of the request in OTWD's logs.
          type: string
      additionalProperties: true
    ValidationProblem:
      description: A problem with the list of validation errors found.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [pointer, message]
                properties:
                  pointer:
                    description: JSON Pointer to the offending part of the request body.
                    type: string
                  message:
                    type: string
    ConflictProblem:
      description: A problem describing a conflict with newer changes to the record.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            current_change_seq:
              $ref: "../schema/common.schema.json#/$defs/ChangeSeq"
            conflicting_fields:
              description: JSON Pointers to the touched facts that changed after base_change_seq.
              type: array
              items:
                type: string
    Redirect:
      description: Body of a 301 for a merged record.
      type: object
      required: [redirect_to, location]
      properties:
        redirect_to:
          $ref: "../schema/common.schema.json#/$defs/RecordId"
        location:
          type: string
          format: uri-reference
    SitePage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: "../schema/site-compact.schema.json"
              - $ref: "../schema/site.schema.json"
        next_cursor:
          description: Cursor for the next page, or null on the last page.
          type: [string, "null"]
        distances_km:
          description: With near only. Distance from the centre to each listed site, by public ID.
          type: object
          additionalProperties:
            type: number
            minimum: 0
        attribution:
          description: The credit to show with these sites.
          type: string
          example: "Data: Open Touring contributors, opentouring.org, CC BY 4.0"
    SiteFeatureCollection:
      description: The same page as GeoJSON (RFC 7946). Each feature is a Point whose properties are the compact site form. next_cursor and attribution are foreign members.
      type: object
      required: [type, features, next_cursor]
      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type:
                const: Feature
              id:
                $ref: "../schema/common.schema.json#/$defs/SiteId"
              geometry:
                $ref: "../schema/common.schema.json#/$defs/GeoJsonPoint"
              properties:
                $ref: "../schema/site-compact.schema.json"
        next_cursor:
          type: [string, "null"]
        attribution:
          type: string
    RoadRestrictionPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: "../schema/road-restriction-compact.schema.json"
              - $ref: "../schema/road-restriction.schema.json"
        next_cursor:
          description: Cursor for the next page, or null on the last page.
          type: [string, "null"]
        distances_km:
          $ref: "#/components/schemas/DistancesKm"
        route_positions_km:
          $ref: "#/components/schemas/RoutePositionsKm"
        attribution:
          description: The credit to show with these road restrictions.
          type: string
          example: "Data: Open Touring contributors, opentouring.org, CC BY 4.0"
    RoadRestrictionFeatureCollection:
      description: The same page as GeoJSON (RFC 7946). Each feature's properties are the compact form. next_cursor and attribution are foreign members.
      type: object
      required: [type, features, next_cursor]
      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type:
                const: Feature
              id:
                $ref: "../schema/common.schema.json#/$defs/RoadRestrictionId"
              geometry:
                $ref: "../schema/common.schema.json#/$defs/GeoJsonPoint"
              properties:
                $ref: "../schema/road-restriction-compact.schema.json"
        next_cursor:
          type: [string, "null"]
        attribution:
          type: string
    RoadSegmentPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: "../schema/road-segment-compact.schema.json"
              - $ref: "../schema/road-segment.schema.json"
        next_cursor:
          description: Cursor for the next page, or null on the last page.
          type: [string, "null"]
        distances_km:
          $ref: "#/components/schemas/DistancesKm"
        route_positions_km:
          $ref: "#/components/schemas/RoutePositionsKm"
        attribution:
          description: The credit to show with these road segments.
          type: string
          example: "Data: Open Touring contributors, opentouring.org, CC BY 4.0"
    RoadSegmentFeatureCollection:
      description: The same page as GeoJSON (RFC 7946). Each feature's properties are the compact form. next_cursor and attribution are foreign members.
      type: object
      required: [type, features, next_cursor]
      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type:
                const: Feature
              id:
                $ref: "../schema/common.schema.json#/$defs/RoadSegmentId"
              geometry:
                $ref: "../schema/values.schema.json#/$defs/LineGeometry"
              properties:
                $ref: "../schema/road-segment-compact.schema.json"
        next_cursor:
          type: [string, "null"]
        attribution:
          type: string
    FerryServicePage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: "../schema/ferry-service-compact.schema.json"
              - $ref: "../schema/ferry-service.schema.json"
        next_cursor:
          description: Cursor for the next page, or null on the last page.
          type: [string, "null"]
        distances_km:
          $ref: "#/components/schemas/DistancesKm"
        route_positions_km:
          $ref: "#/components/schemas/RoutePositionsKm"
        attribution:
          description: The credit to show with these ferry services.
          type: string
          example: "Data: Open Touring contributors, opentouring.org, CC BY 4.0"
    FerryServiceFeatureCollection:
      description: The same page as GeoJSON (RFC 7946). Each feature's properties are the compact form. next_cursor and attribution are foreign members.
      type: object
      required: [type, features, next_cursor]
      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type:
                const: Feature
              id:
                $ref: "../schema/common.schema.json#/$defs/FerryServiceId"
              geometry:
                $ref: "../schema/values.schema.json#/$defs/LineGeometry"
              properties:
                $ref: "../schema/ferry-service-compact.schema.json"
        next_cursor:
          type: [string, "null"]
        attribution:
          type: string
    DistancesKm:
      description: With near only. Distance from the centre to each listed record, by public ID.
      type: object
      additionalProperties:
        type: number
        minimum: 0
    RoutePositionsKm:
      description: With route only. How far along the route each listed record is first met, in kilometres, by public ID.
      type: object
      additionalProperties:
        type: number
        minimum: 0
    Download:
      type: object
      required:
        [
          id,
          record_type,
          kind,
          format,
          url,
          size_bytes,
          sha256,
          generated_at,
          schema_version,
          to_seq,
          licence,
        ]
      properties:
        id:
          type: string
          example: au-sites-full-20261016-geoparquet
        record_type:
          $ref: "../schema/common.schema.json#/$defs/RecordType"
        kind:
          type: string
          enum: [full, delta]
        format:
          type: string
          enum: [geoparquet, geojson, geojsonseq]
        url:
          description: Signed HTTPS URL on the CDN, valid until expires_at.
          type: string
          format: uri
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          description: SHA-256 of the file.
          $ref: "../schema/common.schema.json#/$defs/Sha256"
        generated_at:
          $ref: "#/components/schemas/Timestamp"
        schema_version:
          type: string
          example: "1.0"
        from_seq:
          description: For delta files, the first sequence number included is greater than this.
          type: integer
          minimum: 0
        to_seq:
          description: The last sequence number included. A full download contains every change up to it.
          $ref: "../schema/common.schema.json#/$defs/ChangeSeq"
        record_count:
          type: integer
          minimum: 0
        country_code:
          $ref: "../schema/common.schema.json#/$defs/CountryCode"
        subdivision_code:
          $ref: "../schema/common.schema.json#/$defs/SubdivisionCode"
        licence:
          const: CC-BY-4.0
    DownloadList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Download"
    ChangePage:
      type: object
      required: [data, next_after_seq, latest_seq, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "../schema/change.schema.json"
        next_after_seq:
          description: Send as after_seq on the next call. Equal to the request's after_seq when the page is empty.
          type: integer
          minimum: 0
        latest_seq:
          description: The highest sequence number applied so far.
          type: integer
          minimum: 0
        has_more:
          type: boolean
    SubmissionAccepted:
      type: object
      required: [submission_id, status, status_url, received_at]
      properties:
        submission_id:
          $ref: "../schema/common.schema.json#/$defs/SubmissionId"
        status:
          const: received
        status_url:
          type: string
          format: uri
        received_at:
          $ref: "#/components/schemas/Timestamp"
        partner_reference:
          type: string
    SubmissionStatus:
      type: object
      required: [submission_id, kind, status, received_at, updated_at]
      properties:
        submission_id:
          $ref: "../schema/common.schema.json#/$defs/SubmissionId"
        kind:
          type: string
          enum:
            [
              new_site,
              new_road_restriction,
              new_road_segment,
              new_ferry_service,
              update_facts,
              add_photo,
              report_closure,
              request_merge,
              report_problem,
            ]
        record_id:
          description: The record concerned, of any record type. For an approved submission that creates a record, the new record's public ID.
          $ref: "../schema/common.schema.json#/$defs/RecordId"
        partner_reference:
          type: string
        status:
          description: received, checking (fixed checks and AI review), in_review (waiting for a moderator), needs_info (waiting for the contributor), approved, edited_and_approved or rejected.
          type: string
          enum: [received, checking, in_review, needs_info, approved, edited_and_approved, rejected]
        received_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        decision:
          $ref: "#/components/schemas/DecisionSummary"
    DecisionSummary:
      description: What a partner app may show its contributor about a moderation decision. The full decision record, including verdicts and moderator identity, is not exposed.
      type: object
      required: [decision_id, outcome, decided_at]
      properties:
        decision_id:
          $ref: "../schema/common.schema.json#/$defs/DecisionId"
        outcome:
          type: string
          enum: [approved, edited_and_approved, rejected, needs_info]
        decided_at:
          $ref: "#/components/schemas/Timestamp"
        decided_by_kind:
          type: string
          enum: [moderator, routing_rule]
        reason_codes:
          type: array
          items:
            type: string
        public_note:
          type: string
        change_seqs:
          type: array
          items:
            $ref: "../schema/common.schema.json#/$defs/ChangeSeq"
        appealable_until:
          description: Last moment the contributor can appeal through the Open Touring website.
          $ref: "#/components/schemas/Timestamp"
    PhotoUploadRequest:
      type: object
      required: [content_type, size_bytes, sha256]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic]
        size_bytes:
          type: integer
          minimum: 1
          maximum: 20000000
        sha256:
          $ref: "../schema/common.schema.json#/$defs/Sha256"
      additionalProperties: false
    PhotoUpload:
      type: object
      required: [upload_id, upload_url, method, expires_at]
      properties:
        upload_id:
          $ref: "../schema/common.schema.json#/$defs/UploadId"
        upload_url:
          description: Where to PUT the image. Always on the API host, never on the storage service.
          type: string
          format: uri
          pattern: "^https://api\\.opentouring\\.org/v1/photo-uploads/"
        method:
          const: PUT
        headers:
          description: Headers to send with the upload, exactly as given.
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    ChangeAppliedEvent:
      type: object
      required: [type, created_at, data]
      properties:
        type:
          const: change.applied
        created_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "../schema/change.schema.json"
    SubmissionDecidedEvent:
      type: object
      required: [type, created_at, data]
      properties:
        type:
          const: submission.decided
        created_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "#/components/schemas/SubmissionStatus"
